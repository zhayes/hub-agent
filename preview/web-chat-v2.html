<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<script>
try {
  const queryTheme = new URLSearchParams(location.search).get("theme");
  const stored = queryTheme || localStorage.getItem("hubagent.preview.theme");
  if (stored === "light" || stored === "dark" || stored === "system") {
    document.querySelector("meta[name=color-scheme]").content = stored === "system" ? "light dark" : stored;
  }
} catch {}
</script>
<title>HubAgent Chat — Signal Console preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
    color-scheme: light dark;
    --ground: light-dark(#f6f5f2, #0f1114);
    --surface: light-dark(#ffffff, #171a1f);
    --raised: light-dark(#eeede8, #1f242c);
    --line: light-dark(#d8d6cf, #303640);
    --line-soft: light-dark(#e8e6e0, #242a33);
    --text: light-dark(#17191c, #f5f7fa);
    --muted: light-dark(#5c6470, #b3bcc8);
    --faint: light-dark(#616975, #8f99a6);
    --accent: light-dark(#c2410c, #ff8a5c);
    --positive: light-dark(#166534, #6ee7b7);
    --negative: light-dark(#b91c1c, #fda4af);
    --warning: light-dark(#92400e, #fcd34d);
    --primary-bg: light-dark(#17191c, #f5f7fa);
    --primary-ink: light-dark(#f5f7fa, #101114);
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --rail: 56px;
    --pad: 20px;
    --gap: 18px;
  }
  :root:has(> head > meta[name="color-scheme"][content="dark"]) { color-scheme: dark; }
  :root:has(> head > meta[name="color-scheme"][content="light"]) { color-scheme: light; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--text); overflow: hidden;
    font-family: var(--sans); font-size: 13px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); display: inline-block; flex: 0 0 auto; }
  .dot.ok { background: var(--positive); }
  .dot.run { background: var(--accent); }
  .dot.warn { background: var(--warning); }
  .dot.bad { background: var(--negative); }
  .dot.idle { background: var(--faint); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 21px; padding: 0 7px;
    border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: var(--raised);
    font-size: 10px; white-space: nowrap;
  }
  .pill.run { color: light-dark(#9a3412, #ffb08f); border-color: light-dark(#f0c6b8, #4a2b20); background: light-dark(#fff1eb, #21150f); }
  .pill.ok { color: light-dark(#166534, #9be8b4); border-color: light-dark(#b9e3c8, #1f3d2c); background: light-dark(#edf8f1, #122019); }
  .pill.warn { color: light-dark(#854d0e, #f9d47b); border-color: light-dark(#ecd7a7, #483b1c); background: light-dark(#fff9e8, #211b0f); }
  .pill.bad { color: light-dark(#9f1239, #ffa3b1); border-color: light-dark(#f0c2cc, #4b2430); background: light-dark(#fff1f4, #21141a); }
  .btn {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    height: 30px; padding: 0 10px; border-radius: 5px; font-size: 12px;
  }
  .btn:hover { color: var(--text); border-color: #3a424e; }
  .btn.primary { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-ink); font-weight: 500; }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn.icon { width: 30px; padding: 0; display: grid; place-items: center; }

  .shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); height: 100vh; }

  /* rail */
  .rail {
    border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center;
    padding: 13px 0; background: var(--ground); z-index: 10;
  }
  .mark { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 7px; display: grid; place-items: center; font-weight: 600; font-size: 14px; letter-spacing: -.04em; margin-bottom: 16px; }
  .rail-nav { display: flex; flex-direction: column; gap: 3px; width: 100%; align-items: center; }
  .rail-btn {
    position: relative; width: 38px; height: 38px; display: grid; place-items: center;
    background: transparent; border: 0; border-radius: 7px; color: var(--faint);
  }
  .rail-btn:hover { color: var(--text); background: var(--raised); }
  .rail-btn.active { color: var(--text); background: var(--raised); }
  .rail-btn.active::before { content: none; }
  .rail-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.5; }
  .rail-btn .count { position: absolute; top: 2px; right: 1px; min-width: 14px; height: 14px; padding: 0 3px; display: grid; place-items: center; background: var(--accent); color: #17100d; border-radius: 4px; font-size: 9px; font-weight: 600; }
  .rail-btn[data-tip]:hover::after {
    content: attr(data-tip); position: absolute; left: 48px; top: 50%; transform: translateY(-50%);
    background: #232831; border: 1px solid #333a45; color: var(--text); padding: 4px 8px;
    border-radius: 5px; font-size: 11px; white-space: nowrap; z-index: 20;
  }
  .rail-bottom { margin-top: auto; }

  /* three-pane workspace */
  .workspace {
  display: grid;
  grid-template-columns: var(--threads-w, 256px) minmax(0, 1fr) var(--context-w, 336px);
  min-width: 0; height: 100vh;
  transition: grid-template-columns .16s ease;
}
.workspace.left-collapsed { --threads-w: 56px; }
.workspace.right-collapsed { --context-w: 48px; }
@media (pointer: coarse) {
    .btn.icon, .mode, .send, .pane-toggle { min-width: 44px; min-height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
  .workspace { transition: none; }
}

  /* threads */
  .threads { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .threads-head { padding: 18px 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .threads-actions { display: flex; align-items: center; gap: 4px; }
  .threads-title { font-size: 15px; font-weight: 500; letter-spacing: -.015em; }
  .threads-search { margin: 0 12px 10px; height: 30px; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 0 9px; color: var(--text); outline: 0; font-size: 12px; }
  .threads-search::placeholder { color: var(--faint); }
  .thread-list { overflow: auto; min-height: 0; padding: 0 6px 12px; }
  .thread-row {
    width: 100%; display: grid; grid-template-columns: 8px minmax(0,1fr); gap: 9px; align-items: start;
    padding: 11px 9px; border: 0; border-radius: 5px; background: transparent; color: var(--text); text-align: left;
  }
  .thread-row:hover { background: var(--raised); }
  .thread-row.active { background: var(--surface); color: var(--text); font-weight: 500; }
  .thread-row .dot { margin-top: 5px; }
  .thread-name { font-size: 12px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-preview { margin-top: 3px; color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-meta { margin-top: 5px; display: flex; gap: 8px; color: var(--faint); font-size: 10px; }

  /* conversation */
  .conversation { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--ground); }
  .conv-head { height: 64px; flex: 0 0 64px; border-bottom: 1px solid var(--line); padding: 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .conv-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-sub { margin-top: 3px; color: var(--faint); font-size: 11px; display: flex; gap: 9px; align-items: center; }
  .conv-actions { display: flex; gap: 7px; align-items: center; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .pane-toggle { color: var(--faint); }
  .pane-toggle:hover { color: var(--text); }
  .messages { flex: 1 1 auto; overflow: auto; padding: 22px 26px 20px; scroll-behavior: smooth; }
  .message { max-width: 760px; margin: 0 auto 22px; }
  .msg-head { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 10px; margin-bottom: 7px; text-transform: uppercase; letter-spacing: .07em; }
  .msg-head .who { color: var(--muted); }
  .msg-head .who.agent { color: var(--text); }
  .msg-head .sep { color: #3a414c; }
  .msg-text { color: var(--text); font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .msg-text p { margin: 0 0 8px; }
  .msg-text p:last-child { margin-bottom: 0; }
  .card { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; overflow: hidden; margin-top: 9px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px; border-bottom: 1px solid var(--line-soft); }
  .card-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; }
  .card-body { padding: 4px 13px 10px; }
  .plan-step { display: grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  .plan-step:last-child { border-bottom: 0; }
  .step-num { color: var(--faint); font-family: var(--mono); font-size: 10px; padding-top: 2px; }
  .step-title { display: block; font-size: 12px; }
  .step-meta { display: block; margin-top: 3px; color: var(--faint); font-size: 10px; }
  .step-state { color: var(--faint); font-size: 10px; }
  .run-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; color: var(--muted); font-size: 11px; }
  .run-row .mono { color: var(--faint); }
  .progress { height: 2px; background: var(--line); position: relative; margin: 8px 0 2px; overflow: hidden; }
  .progress span { position: absolute; left: 0; top: 0; bottom: 0; width: 46%; background: var(--accent); }
  .approval-card { border-color: light-dark(#f0c6b8, #4b3024); background: light-dark(#fff8f4, #1b1410); }
  .approval-card .card-head { border-bottom-color: light-dark(#f0d8ce, #3b251c); }
  .approval-card .card-title { color: light-dark(#9a3412, #ffc0a5); }
  .approval-resource { font-family: var(--mono); color: light-dark(#7c2d12, #f2d6c8); font-size: 11px; margin: 8px 0 4px; overflow-wrap: anywhere; }
  .approval-actions { display: flex; gap: 7px; margin-top: 10px; }
  .result-line { display: flex; align-items: center; gap: 9px; padding: 7px 0; color: var(--muted); font-size: 11px; }
  .result-line:last-child { padding-bottom: 0; }
  .check-table { width: 100%; border-collapse: collapse; }
  .check-table td { padding: 6px 0; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  .check-table tr:last-child td { border-bottom: 0; }
  .check-table .cmd { font-family: var(--mono); font-size: 10px; color: var(--text); max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .check-table .right { text-align: right; }
  .answer { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .answer strong { color: var(--text); font-weight: 500; }
  .answer code { font-family: var(--mono); font-size: 11px; color: var(--text); background: var(--raised); padding: 1px 4px; border-radius: 3px; }

  /* composer */
  .composer-wrap { flex: 0 0 auto; padding: 12px 22px 18px; border-top: 0; background: transparent; }
  .composer { max-width: 760px; margin: 0 auto; border: 0; background: var(--surface); border-radius: 10px; }
  .composer:focus-within { background: var(--raised); }
  .composer textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .composer-top { display: flex; align-items: center; gap: 3px; padding: 8px 10px 0; }
  .mode { width: 28px; height: 26px; display: grid; place-items: center; border: 0; background: transparent; color: var(--faint); font-size: 11px; padding: 0; border-radius: 5px; }
  .mode:hover { color: var(--text); }
  .mode.active { color: var(--text); background: var(--raised); }
  .mode svg { width: 14px; height: 14px; }
  .scope { margin-left: auto; color: var(--faint); font-size: 10px; display: flex; gap: 8px; }
  .composer textarea { width: 100%; min-height: 52px; max-height: 150px; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); padding: 8px 12px 4px; font-size: 13px; line-height: 1.5; }
  .composer textarea::placeholder { color: var(--faint); }
  .composer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 10px 9px; }
  .hint { color: var(--faint); font-size: 10px; }
  .send { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--primary-bg); background: var(--primary-bg); color: var(--primary-ink); padding: 0; font-size: 11px; font-weight: 500; }
  .send svg { width: 15px; height: 15px; }
  .send:hover { filter: brightness(1.12); }
  .send:disabled { opacity: .4; cursor: default; }

  /* context */
  .context { border-left: 1px solid var(--line); background: light-dark(#f1f0ec, #111419); overflow: auto; min-height: 0; }
  .context-head { padding: 18px 16px 12px; border-bottom: 1px solid var(--line); }
  .context-head-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .context-eyebrow { color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .context-title { font-size: 13px; font-weight: 500; margin-top: 5px; }
  .context-meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; color: var(--faint); font-size: 10px; }
  .context-body { padding: 16px; }
  .context-section { margin-bottom: 22px; }
  .context-label { color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
  .spine { position: relative; padding-left: 17px; }
  .spine::before { content: ""; position: absolute; left: 3px; top: 5px; bottom: 8px; width: 1px; background: var(--line); }
  .node { position: relative; padding-bottom: 15px; }
  .node:last-child { padding-bottom: 0; }
  .node::before { content: ""; position: absolute; left: -17px; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--ground); border: 1px solid var(--faint); z-index: 1; }
  .node.done::before { background: var(--positive); border-color: var(--positive); }
  .node.run::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,122,69,.12); }
  .node.wait::before { background: var(--warning); border-color: var(--warning); }
  .node-title { font-size: 11px; color: var(--text); }
  .node-meta { margin-top: 3px; color: var(--faint); font-size: 10px; line-height: 1.45; }
  .evidence-mini { border-top: 1px solid var(--line); }
  .evidence-mini-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 10px; }
  .evidence-mini-row .cmd { color: var(--muted); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .decision-mini { padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  .decision-mini:last-child { border-bottom: 0; }
  .decision-mini .type { color: var(--muted); font-size: 10px; font-family: var(--mono); }
  .decision-mini p { margin: 3px 0 0; color: var(--faint); font-size: 11px; line-height: 1.5; }
  .context-approval { border: 1px solid light-dark(#f0c6b8, #4b3024); background: light-dark(#fff8f4, #1b1410); border-radius: 6px; padding: 10px; margin-bottom: 18px; }
  .context-approval strong { display: block; color: light-dark(#9a3412, #ffc0a5); font-size: 11px; }
  .context-approval .res { color: light-dark(#7c2d12, #f2d6c8); font-family: var(--mono); font-size: 10px; margin: 4px 0 8px; overflow-wrap: anywhere; }
  .context-approval .actions { display: flex; gap: 6px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: light-dark(#ffffff, #232831); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 11px; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 50; }
  .toast.show { opacity: 1; }

.threads.collapsed .threads-head,
  .threads.collapsed .threads-search,
  .threads.collapsed .thread-name,
  .threads.collapsed .thread-preview,
  .threads.collapsed .thread-meta { display: none; }
  .threads.collapsed .thread-list { padding: 10px 0; }
  .threads.collapsed .thread-row { display: flex; justify-content: center; padding: 12px 0; min-width: 0; }
  .threads.collapsed .thread-row .dot { margin: 0; }
  .context.collapsed .context-head,
  .context.collapsed .context-body { display: none; }
  .context.collapsed .context-rail-label { display: flex; }
  .context-rail-label {
    display: none; height: 100%; width: 100%; align-items: center; justify-content: center;
    background: transparent; border: 0; padding: 8px 0; cursor: pointer;
    writing-mode: vertical-rl; text-orientation: mixed; color: var(--faint);
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase; gap: 8px;
  }
  .context-rail-label:hover { color: var(--text); }
  .rail-lang {
    position: absolute; right: 3px; bottom: 3px; font-size: 8px; font-weight: 600;
    color: var(--text); background: var(--raised); border-radius: 3px; padding: 0 3px;
    line-height: 12px;
  }
  @media (max-width: 1180px) {
    .workspace { grid-template-columns: var(--threads-w, 224px) minmax(0,1fr); }
    .context { display: none; }
  }
  @media (max-width: 820px) {
    body { overflow-x: hidden; overflow-y: auto; }
    .shell { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
    .rail { position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: 52px; flex-direction: row; justify-content: space-around; border-right: 0; border-top: 1px solid var(--line); padding: 0; z-index: 40; }
    .mark { display: none; }
    .rail-nav { flex-direction: row; justify-content: space-around; }
    .rail-bottom { margin: 0; }
    .workspace { grid-template-columns: 1fr; height: auto; min-height: 100vh; padding-bottom: 52px; }
    .workspace.left-collapsed, .workspace.right-collapsed { --threads-w: 1fr; --context-w: 0; }
    .threads.collapsed .threads-head, .threads.collapsed .threads-search,
    .threads.collapsed .thread-name, .threads.collapsed .thread-preview,
    .threads.collapsed .thread-meta { display: revert; }
    .threads.collapsed .thread-row { display: grid; justify-content: initial; padding: 11px 9px; min-width: 220px; }
    .threads.collapsed .thread-list { display: flex; padding: 0 8px 10px; }
    .pane-toggle { display: none; }
    .threads { border-right: 0; border-bottom: 1px solid var(--line); width: 100%; min-width: 0; overflow: hidden; }
    .threads-head { padding-top: 14px; }
    .thread-list { display: flex; overflow-x: auto; gap: 4px; padding: 0 8px 10px; }
    .thread-row { min-width: 220px; background: var(--surface); }
    .conversation { min-height: 70vh; width: 100%; min-width: 0; max-width: 100vw; overflow: hidden; }
    .conv-head { padding: 0 16px; min-width: 0; overflow: hidden; }
    .conv-sub { min-width: 0; overflow: hidden; white-space: nowrap; }
    .conv-sub .mono { max-width: 48vw; overflow: hidden; text-overflow: ellipsis; }
    .messages { padding: 16px; overflow-x: hidden; max-width: 100vw; }
    .message { width: 100%; max-width: 100%; min-width: 0; }
    .msg-text { overflow-wrap: anywhere; }
    .card { max-width: 100%; }
    .composer-wrap { padding: 10px 12px 14px; width: 100%; }
    .context { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="Primary navigation">
    <div class="mark" aria-label="HubAgent">H</div>
    <nav class="rail-nav">
      <button class="rail-btn active" data-tip="Chat" aria-label="Chat">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 3V5Z"/><path d="M8 9h8M8 12h5"/></svg>
      </button>
      <button class="rail-btn" data-href="web-console.html" data-tip="Tasks" aria-label="Tasks">
        <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </button>
      <button class="rail-btn" data-href="web-console.html#agents" data-tip="Agents" aria-label="Agents">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M9 2v3M15 2v3M8 11h.01M16 11h.01M9 16h6"/></svg>
      </button>
      <button class="rail-btn" data-href="web-console.html#approvals" data-tip="Approvals" aria-label="Approvals">
        <svg viewBox="0 0 24 24"><path d="M7 3h10l3 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7l3-4Z"/><path d="M8 13l2.5 2.5L16 10"/></svg>
        <span class="count" id="rail-approval-count">2</span>
      </button>
    </nav>

  const key = side === 'left' ? (collapsed ? 'expandThreads' : 'collapseThreads') : (collapsed ? 'expandContext' : 'collapseContext');
  document.querySelectorAll(`[data-pane-toggle="${side}"]`).forEach((button) => {
    button.setAttribute('aria-expanded', String(!collapsed));
    button.setAttribute('aria-label', t(key));
    button.title = t(key);
  });
  if (persist) localStorage.setItem(`hubagent.preview.${side}`, collapsed ? 'collapsed' : 'open');
}

function applyPanes() {
  const params = new URLSearchParams(location.search);
  setPane('left', (params.get('left') ?? localStorage.getItem('hubagent.preview.left')) === 'collapsed', false);
  setPane('right', (params.get('right') ?? localStorage.getItem('hubagent.preview.right')) === 'collapsed', false);
}

function toast(message) {
  const node = $('#toast');
  node.textContent = message;
  node.classList.add('show');
  setTimeout(() => node.classList.remove('show'), 1800);
}

function renderThreads() {
  const filtered = threads.filter((thread) => `${thread.title} ${thread.preview} ${thread.agent}`.toLowerCase().includes(query.toLowerCase()));
  $('#thread-list').innerHTML = filtered.map((thread) => `
    <button class="thread-row ${thread.id === selectedId ? 'active' : ''}" data-thread="${thread.id}">
      <span class="dot ${thread.status === 'running' ? 'run' : thread.status === 'waiting_approval' ? 'warn' : thread.status === 'failed' ? 'bad' : thread.status === 'completed' ? 'ok' : 'idle'}"></span>
      <span>
        <span class="thread-name">${thread.title}</span>
        <span class="thread-preview">${thread.preview}</span>
        <span class="thread-meta"><span>${thread.agent}</span><span>${thread.updated}</span></span>
      </span>
    </button>
  `).join('') || `<p class="faint" style="padding:12px">${t('noThreads')}</p>`;
  document.querySelectorAll('[data-thread]').forEach((button) => button.addEventListener('click', () => {
    selectedId = button.dataset.thread;
    renderThreads();
    renderConversation();
    renderContext();
  }));
}

function planCard(message) {
  return `<div class="card">
    <div class="card-head"><div class="card-title"><span class="dot ${message.runLabel === 'Waiting for approval' ? 'warn' : 'run'}"></span>${message.title}</div><span class="faint" style="font-size:10px">${message.runLabel}</span></div>
    <div class="card-body">
      ${message.steps.map((step, index) => `<div class="plan-step">
        <span class="step-num">${String(index + 1).padStart(2, '0')}</span>
        <span><span class="step-title">${step.title}</span><span class="step-meta">${step.meta}</span></span>
        <span class="step-state">${step.state === 'done' ? '<span class="pill ok">done</span>' : step.state === 'run' ? '<span class="pill run">running</span>' : step.state === 'wait' ? '<span class="pill warn">waiting</span>' : '<span class="pill">ready</span>'}</span>
      </div>`).join('')}
      <div class="faint" style="font-size:11px;padding-top:9px">${message.note}</div>
    </div>
  </div>`;
}

function approvalCard(message) {
  return `<div class="card approval-card">
    <div class="card-head"><div class="card-title"><span class="dot warn"></span>${t('approvalNeeded')} · ${message.reason}</div><span class="pill warn">risk ${message.risk}</span></div>
    <div class="card-body">
      <div class="approval-resource">${message.resource}</div>
      <div class="faint" style="font-size:11px">${language === 'zh' ? 'Approve once 只放行本次；policy 需要单独策略页。' : 'Approve once releases this run only; policy needs a separate policy page.'}</div>
      <div class="approval-actions"><button class="btn primary" data-approve="${message.id || selectedId}">${t('approveOnce')}</button><button class="btn" data-reject="${message.id || selectedId}">${t('reject')}</button></div>
    </div>
  </div>`;
}

function renderMessages(thread) {
  $('#messages').innerHTML = thread.messages.map((message) => {
    if (message.kind === 'user') {
      return `<div class="message"><div class="msg-head"><span class="who">You</span><span class="sep">/</span><span>${message.time}</span></div><div class="msg-text">${message.text}</div></div>`;
    }
    if (message.kind === 'plan') {
      return `<div class="message"><div class="msg-head"><span class="who agent">HubAgent</span><span class="sep">/</span><span>${message.time}</span><span class="sep">/</span><span>${t('plan')}</span></div>${planCard(message)}</div>`;
    }
    if (message.kind === 'approval') {
      return `<div class="message"><div class="msg-head"><span class="who agent">HubAgent</span><span class="sep">/</span><span>${message.time}</span><span class="sep">/</span><span>${t('needsHuman')}</span></div>${approvalCard(message)}</div>`;
    }
    if (message.kind === 'run') {
      return `<div class="message"><div class="msg-head"><span class="who agent">HubAgent</span><span class="sep">/</span><span>${message.time}</span><span class="sep">/</span><span>${t('execution')}</span></div>
        <div class="card"><div class="card-head"><div class="card-title"><span class="dot run"></span>${message.title}</div><span class="pill run">running</span></div>
        <div class="card-body"><div class="run-row"><span class="mono">${message.agent}</span><span class="sep">/</span><span class="mono">${message.branch}</span><span class="sep">/</span><span class="num">${message.elapsed}</span></div>${message.lines.map((line) => `<div class="run-row faint">${line}</div>`).join('')}<div class="progress"><span style="width:${message.progress}%"></span></div></div></div>
      </div>`;
    }
    if (message.kind === 'result') {
      return `<div class="message"><div class="msg-head"><span class="who agent">HubAgent</span><span class="sep">/</span><span>${message.time}</span><span class="sep">/</span><span>${t('result')}</span></div>
        <div class="card"><div class="card-head"><div class="card-title"><span class="dot ok"></span>${message.title}</div><span class="pill ok">pass</span></div><div class="card-body"><div class="faint" style="font-size:11px;padding:4px 0 6px">${message.summary}</div><table class="check-table">${message.checks.map((check) => `<tr><td class="cmd">${check.cmd}</td><td class="right"><span class="pill ok">${check.state}</span></td></tr>`).join('')}</table></div></div>
      </div>`;
    }
    if (message.kind === 'answer') {
      return `<div class="message"><div class="msg-head"><span class="who agent">HubAgent</span><span class="sep">/</span><span>${message.time}</span><span class="sep">/</span><span>${t('answer')}</span></div>
        <div class="card"><div class="card-body" style="padding:13px"><div class="answer"><p><strong>${message.text}</strong></p><ul style="margin:8px 0 0;padding-left:18px;color:var(--muted)">${message.bullets.map((bullet) => `<li>${bullet}</li>`).join('')}</ul><div class="faint mono" style="font-size:10px;margin-top:10px">${message.refs.join(' · ')}</div></div></div></div>
      </div>`;
    }
    return '';
  }).join('');
  document.querySelectorAll('[data-approve]').forEach((button) => button.addEventListener('click', () => {
    const thread = threads.find((item) => item.id === button.dataset.approve) || thread;
    thread.context.approval = null;
    thread.status = 'running';
    thread.statusLabel = 'running';
    toast(t('approved'));
    renderThreads();
    renderConversation();
    renderContext();
  }));
  document.querySelectorAll('[data-reject]').forEach((button) => button.addEventListener('click', () => {
    const thread = threads.find((item) => item.id === button.dataset.reject) || thread;
    thread.context.approval = null;
    thread.status = 'failed';
    thread.statusLabel = 'failed';
    toast(t('rejected'));
    renderThreads();
    renderConversation();
    renderContext();
  }));
}

function renderConversation() {
  const thread = threads.find((item) => item.id === selectedId);
  if (!thread) return;
  $('#conv-title').textContent = thread.title;
  $('#conv-status').textContent = t(statusKey(thread.status)) || thread.statusLabel;
  $('#conv-task').textContent = thread.taskId;
  $('#conv-dot').className = `dot ${thread.status === 'running' ? 'run' : thread.status === 'waiting_approval' ? 'warn' : thread.status === 'failed' ? 'bad' : thread.status === 'completed' ? 'ok' : 'idle'}`;
  renderMessages(thread);
  const messages = $('#messages');
  messages.scrollTop = messages.scrollHeight;
}

function renderContext() {
  const thread = threads.find((item) => item.id === selectedId);
  if (!thread) return;
  const context = thread.context;
  $('#context-title').textContent = context.title;
  $('#context-task').textContent = context.task;
  $('#context-agent').textContent = context.agent;
  $('#context-body').innerHTML = `
    ${context.approval ? `<div class="context-approval"><strong>${t('approvalNeeded')} · ${context.approval.reason}</strong><div class="res">${context.approval.resource}</div><div class="actions"><button class="btn primary" data-context-approve="${thread.id}" style="height:26px;font-size:11px">${t('approveOnce')}</button><button class="btn" data-context-reject="${thread.id}" style="height:26px;font-size:11px">${t('reject')}</button></div></div>` : ''}
    <div class="context-section"><div class="context-label">${t('runSpine')}</div><div class="spine">${context.spine.map((node) => `<div class="node ${node.state}"><div class="node-title">${node.title}</div><div class="node-meta">${node.meta.replace(/\n/g, '<br>')}</div></div>`).join('')}</div></div>
    <div class="context-section"><div class="context-label">${t('evidence')}</div><div class="evidence-mini">${context.evidence.length ? context.evidence.map((item) => `<div class="evidence-mini-row"><span class="cmd">${item.cmd}</span><span class="pill ${item.state === 'exit 0' || item.state === 'pass' ? 'ok' : 'bad'}">${item.state}</span></div>`).join('') : `<div class="faint" style="font-size:11px;padding:6px 0">${t('noEvidence')}</div>`}</div></div>
    <div class="context-section" style="margin-bottom:0"><div class="context-label">${t('decisions')}</div>${context.decisions.map((item) => `<div class="decision-mini"><div class="type">${item.type}</div><p>${item.text}</p></div>`).join('')}</div>
  `;
  document.querySelectorAll('[data-context-approve]').forEach((button) => button.addEventListener('click', () => {
    const thread = threads.find((item) => item.id === button.dataset.contextApprove);
    if (!thread) return;
    thread.context.approval = null;
    thread.status = 'running'; thread.statusLabel = 'running';
    toast(t('approved'));
    renderThreads(); renderConversation(); renderContext();
  }));
  document.querySelectorAll('[data-context-reject]').forEach((button) => button.addEventListener('click', () => {
    const thread = threads.find((item) => item.id === button.dataset.contextReject);
    if (!thread) return;
    thread.context.approval = null;
    thread.status = 'failed'; thread.statusLabel = 'failed';
    toast(t('rejected'));
    renderThreads(); renderConversation(); renderContext();
  }));
}

function setMode(next) {
  mode = next;
  document.querySelectorAll('.mode').forEach((button) => {
    button.classList.toggle('active', button.dataset.mode === next);
    button.setAttribute('aria-pressed', String(button.dataset.mode === next));
    button.setAttribute('aria-label', button.dataset.mode === 'run' ? t('runTask') : t('askStatus'));
  });
  const send = $('#send');
  send.setAttribute('aria-label', next === 'run' ? t('runTask') : t('askStatus'));
  send.title = next === 'run' ? t('runTask') : t('askStatus');
  $('#send-label').textContent = next === 'run' ? t('run') : t('ask');
  $('#composer-input').placeholder = next === 'run' ? t('composerPlaceholder') : t('askPlaceholder');
}

function sendMessage() {
  const input = $('#composer-input');
  const text = input.value.trim();
  if (!text) return;
  const thread = threads.find((item) => item.id === selectedId);
  if (!thread) return;
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  thread.messages.push({ kind: 'user', time, text });
  if (mode === 'run') {
    thread.messages.push({
      kind: 'plan', time, title: t('planning'), steps: [{ title: 'Inspect context', meta: 'subtask · ready', state: 'ready' }], note: t('planningNote'), runLabel: t('planning'),
    });
  } else {
    thread.messages.push({
      kind: 'answer', time, text: language === 'zh' ? '已读取当前快照。' : 'Snapshot loaded.', bullets: language === 'zh' ? ['当前任务仍在运行，验收尚未开始。', '最近一个 DecisionRecord 是 select_agent。'] : ['The task is still running; verification has not started.', 'The latest DecisionRecord is select_agent.'], refs: ['snapshot · live'],
    });
  }
  input.value = '';
  renderConversation();
  toast(mode === 'run' ? t('queued') : t('answered'));
}

document.querySelector('#theme-toggle').addEventListener('click', () => {
  const next = themes[(themes.indexOf(theme) + 1) % themes.length];
  applyTheme(next);
  toast(theme === 'dark' ? t('themeDark') : theme === 'light' ? t('themeLight') : t('themeSystem'));
});
document.querySelector('#lang-toggle').addEventListener('click', () => {
  language = language === 'zh' ? 'en' : 'zh';
  localStorage.setItem('hubagent.preview.lang', language);
  applyStaticI18n();
  applyPanes();
  renderThreads();
  renderConversation();
  renderContext();
});
document.querySelector('#toggle-threads').addEventListener('click', () => {
  setPane('left', !workspace.classList.contains('left-collapsed'));
});
document.querySelector('#toggle-context').addEventListener('click', () => {
  setPane('right', !workspace.classList.contains('right-collapsed'));
});
document.querySelector('#threads-collapse').addEventListener('click', () => setPane('left', true));
document.querySelector('#context-collapse').addEventListener('click', () => setPane('right', true));
document.querySelector('#context-expand').addEventListener('click', () => setPane('right', false));
window.addEventListener('storage', (event) => {
  if (event.key === 'hubagent.preview.theme' && event.newValue !== null) applyTheme(event.newValue, false);
  if (event.key === 'hubagent.preview.lang' && (event.newValue === 'zh' || event.newValue === 'en')) {
    language = event.newValue;
    applyStaticI18n();
    applyPanes();
    renderThreads();
    renderConversation();
    renderContext();
  }
});

document.querySelectorAll('.mode').forEach((button) => button.addEventListener('click', () => setMode(button.dataset.mode)));
$('#send').addEventListener('click', sendMessage);
$('#composer-input').addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    // IME-safe: Enter confirms a Chinese/Japanese/Korean candidate; don't send.
    if (event.isComposing || event.keyCode === 229) return;
    sendMessage();
  }
});
$('#thread-search').addEventListener('input', (event) => { query = event.currentTarget.value; renderThreads(); });
$('#new-thread').addEventListener('click', () => toast(t('newThreadToast')));
$('#conv-open').addEventListener('click', () => toast(t('openTaskToast')));
document.querySelectorAll('[data-href]').forEach((button) => button.addEventListener('click', () => { window.location.href = button.dataset.href; }));

applyTheme(theme);
applyStaticI18n();
applyPanes();
renderThreads();
renderConversation();
renderContext();
</script>
</body>
</html>
