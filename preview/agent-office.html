<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<script>
try {
  const q = new URLSearchParams(location.search);
  const stored = q.get('theme') || localStorage.getItem('hubagent.preview.theme') || 'system';
  const theme = stored === 'light' || stored === 'dark' ? stored : 'system';
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name=color-scheme]').content = theme === 'system' ? 'light dark' : theme;
  if (q.get('freeze') === '1') document.documentElement.classList.add('freeze');
} catch {}
</script>
<title>Agent Office - HubAgent preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light dark;
    --bg-canvas: light-dark(#faf9f6, #0c0b0a);
    --bg-surface: light-dark(#ffffff, #141311);
    --bg-subtle: light-dark(#f3f1ec, #1b1917);
    --bg-hover: light-dark(#efece6, #201d1a);
    --bg-active: light-dark(#e9e5de, #26221e);
    --fg-default: light-dark(#16181b, #f2efea);
    --fg-muted: light-dark(#575e68, #a8a29a);
    --fg-subtle: light-dark(#6b7280, #8f8a82);
    --line-subtle: light-dark(#e6e3dc, #262320);
    --line-default: light-dark(#dad5cb, #33302b);
    --line-control: light-dark(#8a8175, #6b645b);
    --accent: light-dark(#c2410c, #ff9468);
    --accent-hover: light-dark(#9a3412, #ffb08c);
    --accent-soft: light-dark(#fbede4, #3a2318);
    --success: light-dark(#166534, #5fd39a);
    --success-soft: light-dark(#e4f3e9, #163024);
    --warning: light-dark(#92400e, #f2c26b);
    --warning-soft: light-dark(#fdf3e2, #332916);
    --danger: light-dark(#b42318, #ff9aa5);
    --danger-soft: light-dark(#fdecea, #351d22);
    --ring: light-dark(#c2410c, #ff9468);
    --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius-control: 6px;
    --radius-panel: 10px;
    --radius-pill: 999px;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  :root[data-theme="system"] { color-scheme: light dark; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg-canvas); color: var(--fg-default);
    font-family: var(--font-sans); font-size: 14px; line-height: 1.55;
    font-optical-sizing: auto; overflow: hidden;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .mono { font-family: var(--font-mono); }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--fg-muted); }
  .subtle { color: var(--fg-subtle); }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .shell { display: grid; grid-template-columns: 56px minmax(0, 1fr); height: 100dvh; }
  .rail {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border-right: 1px solid var(--line-subtle); background: var(--bg-canvas);
    padding: 12px 0; z-index: 20;
  }
  .brand {
    width: 40px; height: 40px; display: grid; place-items: center;
    color: var(--accent); border-radius: var(--radius-panel); margin-bottom: 12px;
  }
  .brand svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .rail-nav { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .rail-btn {
    position: relative; width: 40px; height: 40px; display: grid; place-items: center;
    border: 0; background: transparent; color: var(--fg-muted); border-radius: var(--radius-panel);
  }
  .rail-btn:hover { background: var(--bg-hover); color: var(--fg-default); }
  .rail-btn[aria-current="page"] { background: var(--bg-active); color: var(--fg-default); }
  .rail-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.75; }
  .rail-badge {
    position: absolute; top: 0; right: 0; min-width: 18px; height: 18px; padding: 0 4px;
    display: grid; place-items: center; border-radius: var(--radius-pill);
    background: var(--accent); color: var(--bg-canvas); font-size: 11px; font-weight: 600;
  }
  .rail-bottom {
    margin-top: auto; display: flex; flex-direction: column; gap: 4px; align-items: center;
    padding-top: 12px; border-top: 1px solid var(--line-subtle); width: 40px;
  }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar {
    height: 48px; flex: 0 0 48px; display: flex; align-items: center;
    justify-content: space-between; gap: 16px;
    border-bottom: 1px solid var(--line-subtle); padding: 0 24px;
  }
  .topbar-left { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .app-name { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .workspace { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: var(--fg-subtle); white-space: nowrap; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .connection {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
    border: 1px solid var(--line-subtle); border-radius: var(--radius-pill);
    background: var(--bg-surface); color: var(--fg-muted); font-size: 11px; white-space: nowrap;
  }

  .page {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px;
    padding: 24px; max-width: 1720px; width: 100%; margin: 0 auto;
  }
  .page-head { flex: 0 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .title-line { display: flex; align-items: baseline; gap: 12px; }
  h1 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; }
  .scene-tag {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--fg-subtle);
    border: 1px solid var(--line-subtle); border-radius: var(--radius-control); padding: 2px 6px;
    white-space: nowrap;
  }
  .page-note { margin: 8px 0 0; font-size: 13px; color: var(--fg-muted); }
  .head-actions { display: flex; align-items: center; gap: 8px; }
  .preview-chip {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px;
    border: 1px solid var(--line-subtle); border-radius: var(--radius-pill);
    background: var(--bg-surface); color: var(--fg-muted); font-family: var(--font-mono);
    font-size: 11px; white-space: nowrap;
  }

  .stage {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    border: 1px solid var(--line-subtle); border-radius: var(--radius-panel);
    background: light-dark(#e8decd, #0f0d0b);
  }
  #canvas-wrap { position: absolute; inset: 0; }
  #canvas-wrap canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .hud-card {
    position: absolute; z-index: 5; background: var(--bg-surface);
    border: 1px solid var(--line-default); border-radius: var(--radius-panel);
    box-shadow: 0 8px 24px rgb(0 0 0 / 10%);
  }
  .hud-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--fg-subtle); }
  .hud-title { margin-top: 4px; font-size: 16px; line-height: 1.35; font-weight: 600; letter-spacing: -.01em; }
  .goal-id { margin-left: 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 400; color: var(--fg-subtle); }

  .dispatch-card { top: 16px; left: 16px; width: 352px; padding: 16px; }
  .plan-row { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--fg-muted); }
  .plan { display: inline-flex; align-items: center; gap: 4px; }
  .plan-seg { width: 22px; height: 6px; border: 1px solid var(--line-subtle); border-radius: var(--radius-pill); }
  .plan-seg.done { background: var(--accent); border-color: var(--accent); }
  .plan-seg.current { background: var(--accent-soft); border-color: var(--accent); }
  .queue-tag {
    display: inline-flex; align-items: center; height: 20px; padding: 0 6px;
    border: 1px solid var(--line-subtle); border-radius: var(--radius-pill);
    background: var(--bg-subtle); font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted);
  }
  .current-line {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-subtle);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--fg-muted);
    min-height: 42px;
  }
  .current-line strong { color: var(--fg-default); font-weight: 500; }
  .current-line .arrow { color: var(--accent); }
  .current-line .elapsed { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); }
  .dispatch-note { margin-top: 4px; font-size: 11px; color: var(--fg-subtle); }
  .hud-actions { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mock-note { font-size: 11px; color: var(--fg-subtle); }
  .demo-progress { margin-top: 8px; height: 2px; background: var(--line-subtle); overflow: hidden; border-radius: var(--radius-pill); }
  .demo-progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }

  .stage-tag {
    position: absolute; top: 16px; right: 16px; z-index: 5;
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
    border: 1px solid var(--line-subtle); border-radius: var(--radius-pill);
    background: var(--bg-surface); color: var(--fg-muted);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em;
  }

  .call-sheet {
    left: 16px; bottom: 16px; z-index: 5; width: min(820px, calc(100% - 132px));
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .roster { display: flex; align-items: stretch; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
  .roster::-webkit-scrollbar { height: 4px; }
  .roster::-webkit-scrollbar-thumb { background: var(--line-default); border-radius: 999px; }
  .roster-chip {
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    min-height: 40px; padding: 4px 8px 4px 4px; border: 1px solid transparent;
    border-radius: var(--radius-control); background: transparent; text-align: left;
  }
  .roster-chip:hover { background: var(--bg-hover); }
  .roster-chip.is-selected { background: var(--bg-active); border-color: var(--line-subtle); }
  .roster-avatar {
    position: relative; width: 28px; height: 28px; flex: 0 0 auto; display: grid; place-items: center;
    border-radius: var(--radius-pill); background: var(--cloth, var(--fg-muted));
    border: 1px solid var(--line-default); color: #f6efe4;
    font-size: 11px; font-weight: 600;
  }
  .roster-avatar .mini-dot {
    position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px;
    border-radius: var(--radius-pill); border: 1px solid var(--bg-surface); background: var(--fg-subtle);
  }
  .roster-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .roster-name { font-size: 13px; font-weight: 500; white-space: nowrap; }
  .roster-status { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--fg-muted); white-space: nowrap; }
  .roster-status .dot { width: 6px; height: 6px; }

  .camera-dock {
    right: 16px; bottom: 16px; z-index: 5; display: flex; align-items: center; gap: 2px; padding: 4px;
  }
  .camera-dock .icon-btn { width: 32px; height: 32px; }

  .dot { width: 7px; height: 7px; border-radius: var(--radius-pill); background: var(--fg-subtle); flex: 0 0 auto; }
  .dot.run { background: var(--accent); }
  .dot.warn { background: var(--warning); }
  .dot.bad { background: var(--danger); }
  .dot.ok { background: var(--success); }
  .status-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-muted); }
  .roster-avatar .mini-dot.run { background: var(--accent); }
  .roster-avatar .mini-dot.warn { background: var(--warning); }
  .roster-avatar .mini-dot.bad { background: var(--danger); }
  .roster-avatar .mini-dot.ok { background: var(--success); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 12px; border: 1px solid var(--line-control);
    border-radius: var(--radius-control); background: transparent;
    color: var(--fg-default); font-size: 13px; font-weight: 500; white-space: nowrap;
  }
  .btn:hover { background: var(--bg-hover); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.75; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: light-dark(#fff, #16181b); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { background: var(--danger-soft); }
  .btn.ghost { border-color: transparent; color: var(--fg-muted); }
  .btn.ghost:hover { color: var(--fg-default); background: var(--bg-hover); }
  .icon-btn {
    width: 32px; height: 32px; display: grid; place-items: center;
    border: 0; border-radius: var(--radius-control); background: transparent; color: var(--fg-muted);
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--fg-default); }
  .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; }

  .fallback {
    position: absolute; z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(420px, calc(100% - 32px)); padding: 24px; background: var(--bg-surface);
    border: 1px solid var(--danger); border-radius: var(--radius-panel);
  }
  .fallback strong { font-size: 16px; font-weight: 600; color: var(--danger); }
  .fallback p { margin: 8px 0 0; font-size: 13px; color: var(--fg-muted); }

  .tooltip {
    position: fixed; z-index: 70; pointer-events: none; max-width: 280px;
    padding: 8px 12px; background: var(--bg-surface); border: 1px solid var(--line-default);
    border-radius: var(--radius-control); box-shadow: 0 8px 24px rgb(0 0 0 / 12%);
    font-size: 13px; opacity: 0; transform: translateY(4px); transition: opacity .12s ease, transform .12s ease;
  }
  .tooltip.show { opacity: 1; transform: none; }
  .tooltip-name { font-weight: 600; }
  .tooltip-meta { margin-top: 2px; font-size: 11px; color: var(--fg-muted); }

  .scrim {
    position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .32);
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
    width: min(440px, 100vw); display: flex; flex-direction: column;
    background: var(--bg-surface); border-left: 1px solid var(--line-default);
    transform: translateX(100%); transition: transform .18s ease;
  }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: flex-start; gap: 16px; padding: 24px; border-bottom: 1px solid var(--line-subtle); }
  .drawer-avatar {
    width: 56px; height: 56px; flex: 0 0 auto; display: grid; place-items: center;
    border-radius: var(--radius-panel); background: var(--cloth, var(--fg-muted));
    border: 1px solid var(--line-default); color: #f6efe4;
    font-size: 20px; font-weight: 600;
  }
  .drawer-head-main { min-width: 0; flex: 1; }
  .drawer-name { margin: 0; font-size: 16px; line-height: 1.35; font-weight: 600; letter-spacing: -.01em; }
  .drawer-sub { margin-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-muted); }
  .drawer-id { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); }
  .drawer-close { flex: 0 0 auto; margin: -4px -4px 0 0; }
  .drawer-body { flex: 1; overflow: auto; padding: 24px; }
  .drawer-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--line-subtle); }
  .section { margin-bottom: 24px; }
  .section:last-child { margin-bottom: 0; }
  .section-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--fg-subtle); margin-bottom: 8px; }
  .section-title { margin: 0 0 8px; font-size: 16px; line-height: 1.35; font-weight: 600; }
  .section-note { margin: 0; font-size: 13px; color: var(--fg-muted); line-height: 1.55; }
  .task-card {
    padding: 16px; border: 1px solid var(--line-default); border-left: 3px solid var(--accent);
    border-radius: var(--radius-control); background: var(--bg-subtle);
  }
  .task-card.warn { border-color: var(--warning); border-left-color: var(--warning); background: var(--warning-soft); }
  .task-card.bad { border-color: var(--danger); border-left-color: var(--danger); background: var(--danger-soft); }
  .task-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--fg-subtle); }
  .task-title { margin-top: 4px; font-size: 14px; font-weight: 600; }
  .task-sub { margin-top: 4px; font-size: 13px; color: var(--fg-default); }
  .task-meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
  .empty-note {
    padding: 16px; border: 1px dashed var(--line-default); border-radius: var(--radius-control);
    background: var(--bg-subtle); font-size: 13px; color: var(--fg-muted);
  }
  .approval-box {
    margin-top: 12px; padding: 16px; border: 1px solid var(--warning);
    border-radius: var(--radius-control); background: var(--warning-soft);
  }
  .approval-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .approval-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--warning); }
  .approval-resource { margin-top: 8px; font-family: var(--font-mono); font-size: 11px; color: light-dark(#7c2d12, #f2d6c8); overflow-wrap: anywhere; }
  .approval-note { margin-top: 4px; font-size: 13px; color: var(--fg-muted); }
  .approval-actions { display: flex; gap: 8px; margin-top: 12px; }
  .decision-box {
    margin-top: 12px; padding: 16px; border-radius: var(--radius-control);
    display: flex; align-items: center; gap: 12px; font-size: 13px;
  }
  .decision-box.ok { background: var(--success-soft); border: 1px solid var(--success); color: var(--success); }
  .decision-box.bad { background: var(--danger-soft); border: 1px solid var(--danger); color: var(--danger); }
  .decision-box strong { font-weight: 600; }
  .kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 12px; font-size: 13px; }
  .kv dt { color: var(--fg-muted); }
  .kv dd { margin: 0; color: var(--fg-default); overflow-wrap: anywhere; }
  .kv dd.mono { font-size: 11px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px;
    border: 1px solid var(--line-subtle); border-radius: var(--radius-control);
    background: var(--bg-subtle); color: var(--fg-muted); font-size: 11px; white-space: nowrap;
  }
  .chip.verified { color: var(--success); border-color: light-dark(#b9e3c8, #1f3d2c); background: var(--success-soft); }
  .chip svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; }
  .cap-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .cap-group { margin-top: 12px; }
  .cap-group:first-of-type { margin-top: 0; }
  .cap-label { font-size: 11px; color: var(--fg-subtle); margin-bottom: 6px; }
  .history-row {
    display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 8px 12px;
    align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-subtle); font-size: 13px;
  }
  .history-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .history-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); white-space: nowrap; }
  .event-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-muted); }
  .event-line .mono { font-size: 11px; color: var(--fg-subtle); }

  .toast {
    position: fixed; left: 50%; bottom: 96px; z-index: 60; transform: translate(-50%, 8px);
    max-width: calc(100vw - 32px); padding: 12px 16px;
    background: var(--bg-surface); border: 1px solid var(--line-default);
    border-radius: var(--radius-control); font-size: 13px; color: var(--fg-default);
    box-shadow: 0 8px 24px rgb(0 0 0 / 12%); opacity: 0; pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
  }

  @media (max-width: 1180px) {

function decideAgent(id, action) {

    a.history.unshift({ id: 'T-1024', title: a.subtask, status: 'run', meta: '第 1 次 · 00:01' });

function currentTheme() {
  const t = document.documentElement.dataset.theme;
  return t === 'light' || t === 'dark' ? t : 'system';
}
function isDarkTheme() {
  const t = currentTheme();
  return t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyTheme(theme, persist = true) {
  const t = theme === 'light' || theme === 'dark' ? theme : 'system';
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=color-scheme]').content = t === 'system' ? 'light dark' : t;
  if (persist) { try { localStorage.setItem('hubagent.preview.theme', t); } catch {} }
  const info = THEME[t];
  els.themeBtn.innerHTML = info.icon;
  els.themeBtn.setAttribute('aria-label', '主题：' + info.label);
  els.themeBtn.title = '主题：' + info.label;
  applySceneTheme();
}
function cycleTheme() {
  const order = ['system', 'light', 'dark'];
  const next = order[(order.indexOf(currentTheme()) + 1) % order.length];
  applyTheme(next);
  const url = new URL(location.href);
  url.searchParams.set('theme', next);
  history.replaceState(null, '', url);
}

function canvasTex(w, h, draw) {

function buildRoom() {
  const floor = box(15, 0.16, 10, MAT.floor, 0, -0.08, 0);
  addEdges(floor, 0.12);
  scene.add(floor);

  const pts = [];
  for (let x = -7; x <= 7; x++) pts.push(new THREE.Vector3(x, 0.012, -5), new THREE.Vector3(x, 0.012, 5));
  for (let z = -5; z <= 5; z++) pts.push(new THREE.Vector3(-7, 0.012, z), new THREE.Vector3(7, 0.012, z));
  const grid = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), MAT.grid);
  scene.add(grid);
  MAT.gridMesh = grid;

  const rug = new THREE.Mesh(new THREE.PlaneGeometry(12.6, 3.5), MAT.rug);

function setDeskBuilt(desk, built) {
  desk.group.visible = built;
  desk.blueprint.visible = !built;
  desk.built = built;
}

function updateDesk(desk, a) {
  desk.agentId = a ? a.id : null;
  desk.group.userData.agentId = desk.agentId;
  desk.pick.userData.agentId = desk.agentId;
  if (!a) {
    desk.paperMat.map = null;
    desk.paperMat.needsUpdate = true;
    desk.plateMat.map = null;
    desk.plateMat.needsUpdate = true;
    desk.flag.visible = false;
    desk.mug.visible = false;
    desk.stamp.visible = false;
    return;
  }
  desk.paperMat.map = taskTexture(a);
  desk.paperMat.needsUpdate = true;
  desk.plateMat.map = nameTexture(a);
  desk.plateMat.needsUpdate = true;
  desk.flag.visible = a.status === 'waiting';
  desk.mug.visible = a.status === 'paused';
  desk.stamp.visible = a.status === 'error' || a.status === 'done';
  if (a.status === 'done') {
    desk.stamp.material.map = stampTexture('完', '#166534');
    desk.stamp.material.needsUpdate = true;
  } else {
    desk.stamp.material.map = stampTexture('退回', '#B42318');
    desk.stamp.material.needsUpdate = true;
  }
  setLamp(desk, a.status);
  desk.chair.rotation.y = a.status === 'error' ? 0.45 : 0;
  desk.chair.position.z = a.status === 'error' ? -0.2 : -0.45;
}

function setLamp(desk, status) {
  const tone = status === 'working' ? 'run' : status === 'waiting' || status === 'paused' ? 'warn' : status === 'error' ? 'bad' : status === 'done' ? 'ok' : 'idle';
  const color = tone === 'run' ? 0xc2410c : tone === 'warn' ? 0xb45309 : tone === 'bad' ? 0xb42318 : tone === 'ok' ? 0x166534 : 0x9a8f80;
  desk.bulbMat.color.setHex(color);
  desk.bulbMat.emissive.setHex(color);
  desk.bulbMat.emissiveIntensity = tone === 'idle' ? 0.15 : (isDarkTheme() ? 2.4 : 1.1);
  desk.poolMat.color.setHex(color);
  desk.poolMat.opacity = tone === 'idle' ? 0.03 : (isDarkTheme() ? 0.28 : 0.13);
}

function poseSeated(entry) {
  entry.body.position.y = -0.28;
  entry.legL.rotation.x = -1.35;
  entry.legR.rotation.x = -1.35;
  entry.armL.rotation.x = -0.95;
  entry.armR.rotation.x = -0.95;
  entry.head.rotation.x = -0.12;
  entry.seated = true;
}

function poseStanding(entry) {
  entry.body.position.y = 0;
  entry.legL.rotation.x = 0;
  entry.legR.rotation.x = 0;
  entry.armL.rotation.x = 0;
  entry.armR.rotation.x = 0;
  entry.head.rotation.x = 0;
  entry.head.rotation.y = 0;
  entry.seated = false;
}

function placeInitialState() {
  for (const a of agents) {
    if (a.id === 'aider') continue;
    const entry = entries.get(a.id);
    const desk = desks[a.desk];
    if (!entry) continue;
    if (a.id === 'goose') {
      if (frozen || reduced) {
        setDeskBuilt(desk, true);
        updateDesk(desk, a);
        entry.root.position.set(desk.slot.x, 0, desk.slot.z - 0.45);
        entry.root.rotation.y = 0;
        entry.root.visible = true;
        poseSeated(entry);
        entry.anim = 'working';
      } else {
        setDeskBuilt(desk, false);
        updateDesk(desk, null);
        entry.root.visible = false;
        entry.anim = 'idle';
      }
      continue;
    }
    setDeskBuilt(desk, true);
    updateDesk(desk, a);
    entry.root.position.set(desk.slot.x, 0, desk.slot.z - 0.45);

function walkIn(entry, desk, done) {
  if (reduced) {
    entry.root.position.set(desk.slot.x, 0, desk.slot.z - 0.45);

    poseStanding(entry);
    done();

  const p2 = new THREE.Vector3(Math.max(desk.slot.x - 1.2, -3.2), 0, -1.55);
  const end = new THREE.Vector3(desk.slot.x, 0, desk.slot.z - 0.45);
  const curve = new THREE.CatmullRomCurve3([start, p1, p2, end]);
  const from = entry.root.position.clone();
  entry.anim = 'walking';
  tween(1500, (p) => {
    const pos = curve.getPoint(p);
    const next = curve.getPoint(Math.min(1, p + 0.01));
    entry.root.position.copy(pos);
    entry.root.rotation.y = Math.atan2(next.x - pos.x, next.z - pos.z);
    const phase = p * Math.PI * 9;
    entry.legL.rotation.x = Math.sin(phase) * 0.55;
    entry.legR.rotation.x = -Math.sin(phase) * 0.55;
    entry.armL.rotation.x = -Math.sin(phase) * 0.45;
    entry.armR.rotation.x = Math.sin(phase) * 0.45;
    entry.body.position.y = Math.abs(Math.sin(phase)) * 0.035;
  }, () => {
    entry.root.position.set(end.x, 0, end.z);
    entry.root.rotation.y = 0;
    entry.legL.rotation.x = 0;
    entry.legR.rotation.x = 0;
    entry.armL.rotation.x = 0;
    entry.armR.rotation.x = 0;
    entry.body.position.y = 0;
    entry.anim = 'seated';
    done();
  }, (t) => t);
}

function burst(x, z, cloth) {
  if (reduced) return;
  for (let i = 0; i < 10; i++) {
    const m = plane(0.09, 0.06, new THREE.MeshBasicMaterial({ color: i % 3 === 0 ? cloth : 0xf6efe4, side: THREE.DoubleSide }));
    m.position.set(x + (Math.random() - 0.5) * 1.4, 0.85, z + (Math.random() - 0.5) * 0.7);
    m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    scene.add(m);
    particles.push({
      mesh: m,
      vx: (Math.random() - 0.5) * 1.6,
      vy: 1.4 + Math.random() * 1.4,
      vz: (Math.random() - 0.5) * 1.6,
      life: 0.9,
      rot: (Math.random() - 0.5) * 8,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose(); particles.splice(i, 1); continue; }
    p.vy -= 5.2 * dt;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.mesh.rotation.x += p.rot * dt;
    p.mesh.rotation.y += p.rot * 0.7 * dt;
  }
}

/* ------------------------------------------------------------------ animate */
function tween(duration, update, done, ease) {
  if (reduced) { update(1, 1); if (done) done(); return null; }
  const tw = { t: 0, duration: Math.max(1, duration), update, done, ease: ease || ((x) => 1 - Math.pow(1 - x, 3)) };
  tweens.push(tw);
  return tw;
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    const p = Math.min(1, tw.t / tw.duration);
    tw.update(tw.ease(p), p);
    if (p >= 1) {
      tweens.splice(i, 1);
      if (tw.done) tw.done();
    }
  }
}

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (!sceneReady || document.hidden) return;
  if (!frozen) updateTweens(dt * 1000);
  updateParticles(dt);
  if (!frozen) updateAgentAmbient(now);
  renderer.render(scene, camera);
}

function updateAgentAmbient(now) {
  const t = now * 0.001;
  for (const entry of entries.values()) {
    if (!entry.root.visible) continue;
    if (entry.anim === 'working') {
      entry.armL.rotation.x = -0.95 + Math.sin(t * 5.5) * 0.065;
      entry.armR.rotation.x = -0.95 + Math.sin(t * 5.5 + Math.PI) * 0.065;
      entry.head.rotation.y = Math.sin(t * 0.9) * 0.035;
    } else if (entry.anim === 'waiting') {
      entry.armR.rotation.x = -2.55 + Math.sin(t * 1.6) * 0.035;
      entry.armR.rotation.z = -0.12;
      entry.head.rotation.y = Math.sin(t * 0.7) * 0.05;
    } else if (entry.anim === 'paused') {
      entry.body.position.y = -0.28 + Math.sin(t * 1.2) * 0.005;
      entry.head.rotation.x = 0.06 + Math.sin(t * 0.8) * 0.01;
    }
  }
}

/* ------------------------------------------------------------------ camera */
function updateCamera() {
  camera.position.copy(cam.target).add(cam.offset);
  camera.lookAt(cam.target);
  camera.zoom = cam.zoom;
  camera.updateProjectionMatrix();
}
function onResize() {
  if (!renderer || !camera) return;
  const w = els.stage.clientWidth;
  const h = els.stage.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  const aspect = w / h;
  const viewSize = Math.max(11.6, 15.4 / aspect);
  camera.left = -viewSize * aspect / 2;
  camera.right = viewSize * aspect / 2;
  camera.top = viewSize / 2;
  camera.bottom = -viewSize / 2;
  updateCamera();
}
function tweenCamera(target, zoom, dur = 520) {
  const fromT = cam.target.clone();
  const fromZ = cam.zoom;
  tween(dur, (p) => {
    cam.target.lerpVectors(fromT, target, p);
    cam.zoom = THREE.MathUtils.lerp(fromZ, zoom, p);
    updateCamera();
  }, null, (x) => 1 - Math.pow(1 - x, 3));
}
function focusAgent(id) {
  const a = byId.get(id);
  if (!a || a.desk === undefined) return;
  const slot = SLOTS[a.desk];
  tweenCamera(new THREE.Vector3(slot.x, 1.0, slot.z - 0.2), 1.42, 520);
}
function resetCamera() {
  tweenCamera(new THREE.Vector3(0, 0.9, -0.1), 1, 520);
}
function zoomCamera(factor) {
  cam.zoom = THREE.MathUtils.clamp(cam.zoom * factor, 0.75, 2.4);
  updateCamera();
}

/* ------------------------------------------------------------------ picking */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function resolvePick(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, true);
  for (const hit of hits) {
    let obj = hit.object;
    while (obj) {
      if (obj.userData && obj.userData.type === 'agent') return { agentId: obj.userData.agentId, deskIndex: byId.get(obj.userData.agentId)?.desk };
      if (obj.userData && obj.userData.type === 'desk') return { agentId: obj.userData.agentId, deskIndex: obj.userData.deskIndex };
      if (obj.userData && obj.userData.type === 'slot') return { agentId: obj.userData.agentId, deskIndex: obj.userData.deskIndex };
      obj = obj.parent;
    }
  }
  return null;
}

function bindSceneEvents() {
  const canvas = renderer.domElement;
  canvas.addEventListener('pointerdown', (e) => {
    dragState = { x: e.clientX, y: e.clientY, moved: false };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (dragState) {
      const dx = e.clientX - dragState.x;
      const dy = e.clientY - dragState.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) {
        dragState.moved = true;
        suppressClick = true;
        const k = 10 / (canvas.clientHeight || 1) / cam.zoom;
        cam.target.x = THREE.MathUtils.clamp(cam.target.x - dx * k, -4.2, 4.2);
        cam.target.z = THREE.MathUtils.clamp(cam.target.z - dy * k, -2.4, 2.8);
        updateCamera();
        hideTooltip();
      }
      return;
    }
    const hit = resolvePick(e.clientX, e.clientY);
    if (hit && hit.deskIndex !== undefined) {
      const slot = SLOTS[hit.deskIndex];
      hoverRing.position.set(slot.x, 0.055, slot.z);
      hoverRing.visible = true;
      canvas.style.cursor = 'pointer';
      const a = hit.agentId ? byId.get(hit.agentId) : null;
      if (a) showTooltip(e.clientX, e.clientY, a);
      else showTooltip(e.clientX, e.clientY, { name: '空工位', status: 'idle', subtask: '等待调度派发', desk: hit.deskIndex });
    } else {
      hoverRing.visible = false;
      canvas.style.cursor = 'default';
      hideTooltip();
    }
  });
  canvas.addEventListener('pointerup', (e) => {
    const wasDrag = dragState && dragState.moved;
    dragState = null;
    if (wasDrag) { suppressClick = false; return; }
    const hit = resolvePick(e.clientX, e.clientY);
    if (!hit) return;
    if (hit.agentId) {
      openDrawer(hit.agentId);
      focusAgent(hit.agentId);
    } else {
      toast('空工位 · 等待调度派发');
    }
  });
  canvas.addEventListener('pointerleave', () => {
    hoverRing.visible = false;
    hideTooltip();
    dragState = null;
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomCamera(e.deltaY > 0 ? 0.92 : 1.08);
  }, { passive: false });

  window.addEventListener('resize', onResize);
  if ('ResizeObserver' in window) new ResizeObserver(onResize).observe(els.stage);
  document.addEventListener('visibilitychange', () => { lastFrame = performance.now(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => {
    if (currentTheme() === 'system') applySceneTheme();
  });
}

function showTooltip(x, y, a) {
  const meta = statusMeta(a.status);
  els.tooltip.innerHTML = '<div class="tooltip-name">' + esc(a.name) + '</div><div class="tooltip-meta">' + esc(meta.label + ' · ' + (a.subtask || a.task || '暂无任务')) + '</div>';
  els.tooltip.classList.add('show');
  const w = els.tooltip.offsetWidth || 200;
  const left = Math.min(x + 14, window.innerWidth - w - 12);
  els.tooltip.style.left = left + 'px';
  els.tooltip.style.top = (y + 14) + 'px';
}
function hideTooltip() { els.tooltip.classList.remove('show'); }

/* ------------------------------------------------------------------ theme scene */
function applySceneTheme() {
  if (!sceneReady || !scene) return;
  const c = isDarkTheme() ? COLORS.dark : COLORS.light;
  scene.background.setHex(c.bg);
  MAT.floor.color.setHex(c.floor);
  MAT.wall.color.setHex(c.wall);
  MAT.rug.color.setHex(c.rug);
  MAT.grid.color.setHex(c.grid);
  MAT.rugEdge.color.setHex(c.grid);
  edgeMats.forEach((m) => { m.color.setHex(c.ink); m.opacity = c.outline; });
  hemi.intensity = c.ambient;
  dir.intensity = c.dir;
  hubLight.intensity = isDarkTheme() ? 1.4 : 0;
  desks.forEach((d) => setLamp(d, d.agentId ? byId.get(d.agentId).status : 'idle'));
}

/* ------------------------------------------------------------------ wire hud */
els.roster.addEventListener('click', (e) => {
  const chip = e.target.closest('[data-agent]');
  if (!chip) return;
  openDrawer(chip.dataset.agent);
  focusAgent(chip.dataset.agent);
});
els.dispatchBtn.addEventListener('click', playDemo);
els.themeBtn.addEventListener('click', cycleTheme);
document.querySelectorAll('[data-cam]').forEach((btn) => {
  btn.addEventListener('click', () => {
    if (btn.dataset.cam === 'in') zoomCamera(1.16);
    if (btn.dataset.cam === 'out') zoomCamera(0.86);
    if (btn.dataset.cam === 'reset') resetCamera();
  });
});
els.scrim.addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && els.drawer.classList.contains('open')) closeDrawer();
  if (e.key !== 'Tab' || !els.drawer.classList.contains('open')) return;
  const focusables = els.drawer.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (focusables.length === 0) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('[data-elapsed]').forEach((el) => {
    el.textContent = fmtDur(now - Number(el.dataset.elapsed));
  });
}, 1000);

applyTheme(document.documentElement.dataset.theme, false);
renderHud();

try {
  await Promise.race([
    document.fonts && document.fonts.ready ? document.fonts.ready.catch(() => {}) : Promise.resolve(),
    new Promise((resolve) => setTimeout(resolve, 1200)),
  ]);
  initScene();
} catch (error) {
  console.error(error);
  els.fallback.hidden = false;
  els.fallback.innerHTML = '<strong>3D 场景加载失败</strong><p>' + esc(error && error.message ? error.message : String(error)) + '</p>';
}
</script>
<script>
setTimeout(function () {
  if (!window.__officeReady) {
    var f = document.getElementById('fallback');
    if (f) f.hidden = false;
  }
}, 6000);
</script>
</body>
</html>
